<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>推免材料上传测试页</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; background: #f4f7fb; }
    main { width: 720px; margin: 48px auto; padding: 32px; background: #fff; border-radius: 12px; }
    h2 { color: #257ffd; }
    .field { display: grid; grid-template-columns: 160px 1fr; align-items: center; gap: 16px; margin-top: 24px; }
    input { padding: 10px; border: 1px solid #d0d5dd; border-radius: 8px; }
    .hidden-file { display: none; }
    .file-button { display: inline-block; padding: 10px 16px; color: #fff; background: #257ffd; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h2>证明材料</h2>
    <div class="field">
      <label for="transcript">本科成绩单</label>
      <input id="transcript" type="file" accept="application/pdf,.pdf" required />
    </div>
    <div class="field">
      <span>外语水平证明（PDF，不超过 2MB）</span>
      <label class="file-button" for="languageProof">选择文件
        <input class="hidden-file" id="languageProof" type="file" accept="application/pdf,.pdf" required />
      </label>
    </div>
    <div class="field">
      <span>已上传本科成绩单</span>
      <a href="./fixtures/transcript.pdf" download>下载已上传成绩单</a>
    </div>
    <a href="https://cross-origin.example/private.pdf">跨域材料不得采集</a>
    <a href="./fixtures/hidden.pdf" style="display: none">隐藏材料不得采集</a>
    <input type="hidden" name="_csrf" value="fixture-secret" />
    <input type="text" name="captchaToken" value="fixture-captcha" />
    <input type="password" name="password" value="fixture-password" />
  </main>
</body>
</html>
