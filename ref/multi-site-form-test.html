<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多站点连续填写测试</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft YaHei", sans-serif; color: #1f2937; background: #f6f8fb; }
    main { width: min(760px, calc(100% - 32px)); margin: 32px auto; padding: 28px; background: #fff; border: 1px solid #dfe5ec; border-radius: 8px; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    #stepLabel { margin: 0 0 24px; color: #667085; }
    .field { display: grid; grid-template-columns: 180px minmax(0, 1fr); align-items: center; gap: 16px; margin-top: 16px; }
    input, select, textarea { width: 100%; min-height: 38px; padding: 8px 10px; border: 1px solid #cfd6df; border-radius: 6px; font: inherit; }
    textarea { min-height: 100px; resize: vertical; }
    table { width: 100%; margin-top: 18px; border-collapse: collapse; }
    th, td { padding: 9px; border: 1px solid #dfe5ec; text-align: left; }
    th { background: #f8fafc; font-size: 13px; }
    .actions { display: flex; justify-content: flex-end; margin-top: 24px; }
    button { min-height: 38px; padding: 8px 16px; border: 0; border-radius: 6px; color: #fff; background: #257ffd; font: inherit; cursor: pointer; }
    .final-warning { padding: 14px; border: 1px solid #f5d28b; border-radius: 6px; color: #92400e; background: #fff9ec; }
  </style>
</head>
<body>
  <main>
    <h1 id="schoolName"></h1>
    <p id="stepLabel"></p>
    <form id="applicationForm" novalidate></form>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const school = params.get('school') || '测试大学';
    let step = 0;
    let submitAttempts = 0;
    const saved = [{}, {}, {}];
    const steps = [
      {
        label: '基本信息',
        html: '<div class="field"><label for="name">姓名</label><input id="name" name="name" required></div>' +
          '<div class="field"><label for="phone">手机号</label><input id="phone" name="phone" required></div>' +
          '<div class="field"><label for="gender">性别</label><select id="gender" name="gender" required><option value="">请选择</option><option>男</option><option>女</option></select></div>'
      },
      {
        label: '学习信息',
        html: '<div class="field"><label for="school">学校</label><input id="school" name="school" required></div>' +
          '<div class="field"><label for="major">专业</label><input id="major" name="major" required></div>' +
          '<div class="field"><label for="rank">成绩排名</label><input id="rank" name="rank" required></div>' +
          '<div class="field"><label for="rankBase">排名基数</label><input id="rankBase" name="rankBase" required></div>'
      },
      {
        label: '奖励情况',
        html: '<table data-repeat-group="奖励情况"><thead><tr><th>获奖名称</th><th>获奖等级</th><th>获奖时间</th></tr></thead>' +
          '<tbody><tr><td><input name="awardName"></td><td><input name="awardLevel"></td><td><input name="awardDate"></td></tr></tbody></table>' +
          '<div class="field"><label for="statement">个人陈述</label><textarea id="statement" name="statement"></textarea></div>'
      },
      {
        label: '最终审核',
        html: '<div class="final-warning">这是最终审核页。测试过程中不得触发下面的最终提交按钮。</div>'
      }
    ];

    function capture() {
      const data = {};
      document.querySelectorAll('input,select,textarea').forEach((field) => { data[field.name] = field.value; });
      saved[step] = data;
    }

    function render() {
      document.title = `${school} - ${steps[step].label}`;
      document.getElementById('schoolName').textContent = school;
      document.getElementById('stepLabel').textContent = `第 ${step + 1} 步 / ${steps.length}：${steps[step].label}`;
      const form = document.getElementById('applicationForm');
      form.innerHTML = steps[step].html;
      Object.entries(saved[step] || {}).forEach(([name, value]) => {
        const field = form.elements.namedItem(name);
        if (field) field.value = value;
      });
      const actions = document.createElement('div');
      actions.className = 'actions';
      const next = document.createElement('button');
      next.type = 'button';
      if (step < steps.length - 1) {
        next.textContent = '保存并下一步';
        next.addEventListener('click', () => { capture(); step += 1; history.pushState({ step }, '', `#step-${step + 1}`); render(); });
      } else {
        next.textContent = '提交申请';
        next.addEventListener('click', () => { submitAttempts += 1; document.body.dataset.submitAttempts = String(submitAttempts); });
      }
      actions.appendChild(next);
      form.appendChild(actions);
      document.body.dataset.step = String(step + 1);
      document.body.dataset.submitAttempts = String(submitAttempts);
    }

    addEventListener('popstate', (event) => { capture(); step = event.state?.step || 0; render(); });
    render();
  </script>
</body>
</html>
